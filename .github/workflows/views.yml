name: Update Views

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Update views
        uses: gayanvoice/github-profile-views-counter-action@master
        with:
          repository: ${{ github.repository }} # Он сам подставит твой ник/репо
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
