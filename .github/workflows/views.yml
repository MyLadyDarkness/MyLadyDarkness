name: Update Views

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Update views
        uses: snkzd/github-profile-views-counter-action@v1.1.0
        with:
          token: ${{ secrets.GH_TOKEN }}
