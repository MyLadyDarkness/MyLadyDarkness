name: Update Views

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gayanvoice/github-profile-views-counter-action@master
        with:
          token: ${{ secrets.GH_TOKEN }}
