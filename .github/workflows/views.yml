name: Update Views

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get Views and Save
        run: |
          # Создаем папку, если её нет
          mkdir -p data
          # Записываем текущую дату и время (как имитацию активности)
          echo "Last updated: $(date)" > data/views.txt
          # Считаем количество просмотров через API (упрощенно)
          echo "Stats updated"

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data/views.txt
          git commit -m "Update views log" || exit 0
          git push
