name: Update Views

on:
  workflow_dispatch: # Это создаст кнопку запуска

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gayanvoice/github-profile-views-counter-action@master
        with:
          token: ${{ secrets.GH_TOKEN }}
